<title id="chart-title">Fleet PDF page count — 88,211 pages across 13 sites (May 22, 2026)</title>
<desc id="chart-desc">As-is snapshot of every PDF currently in the ICJIA fleet. Measured page count is 88,211, approximately 5.9 times the prior estimated ceiling of 15,000. archive-prod alone holds 51,010 pages (58% of the total) across 1,200 PDFs averaging 42.5 pages each. After culling agendas, old meeting minutes, and superseded R&amp;A publications, the remediation target is roughly 55,000 to 65,000 pages. PDF-only count; excludes 421 DOCX, 17 PPTX, and 777 XLSX. Coverage is 99.7% (3,528 of 3,537 PDFs introspected). A text-equivalent version with all per-site numbers is at assets/fleet-pdf-pages-2026-05-22.md.</desc>
